<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 200 200"
  width="200"
  height="200"
>
  <!-- Left vertical bracket line -->
  <line
    x1="30"
    y1="30"
    x2="30"
    y2="170"
    stroke="#CB6441"
    stroke-width="8"
    stroke-linecap="square"
  />

  <!-- Right vertical bracket line -->
  <line
    x1="170"
    y1="30"
    x2="170"
    y2="170"
    stroke="#CB6441"
    stroke-width="8"
    stroke-linecap="square"
  />

  <!-- Center B letter -->
  <text
    x="100"
    y="132"
    font-family="Arial, Helvetica, sans-serif"
    font-size="120"
    font-weight="bold"
    fill="#CB6441"
    text-anchor="middle"
  >
    B
  </text>
</svg>
